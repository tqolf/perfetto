# Robot stability capture: steady-state low-overhead collection, snapshot the
# pre-N + post-M window only when the app fires the "snap" trigger.
buffers { size_kb: 131072 fill_policy: RING_BUFFER }  # holds N+M parsed protobuf
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      # Channel C = detailed ftrace, folded into the deferred-raw set (cached
      # steady-state, parsed into the SAME snapshot on trigger).
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "irq/irq_handler_entry"
      ftrace_events: "irq/irq_handler_exit"
      ftrace_events: "workqueue/workqueue_execute_start"
      ftrace_events: "workqueue/workqueue_execute_end"
      ftrace_events: "block/block_rq_issue"
      ftrace_events: "block/block_rq_complete"
      ftrace_events: "raw_syscalls/sys_enter"
      ftrace_events: "raw_syscalls/sys_exit"

      # Deferred-raw: steady-state cache without parsing; parse on trigger.
      # Keep per_cpu_mem_limit_kb * num_cpus under the traced_probes memory
      # watchdog (~32MB); use disk overflow and/or process filtering for large N.
      deferred_raw_capture {
        enabled: true
        per_cpu_mem_limit_kb: 256
        retain_seconds: 30
        # Optional large-N support (trades memory for sequential IO):
        # disk_overflow_path: "/data/perfetto/draw"
        # per_cpu_disk_limit_kb: 4096
      }

      # Process filtering (kernel-level, drops events before the ring buffer).
      # Static: list the robot's critical PIDs here, OR use the dynamic control
      # file below (HTTP-ready): write the desired PID set at runtime.
      # pids_to_trace: 1234
      pid_filter_control_file: "/run/perfetto/ftrace_pid_filter"
    }
  }
}
# App fires "snap" on anomaly; snapshot = pre-N + post-(stop_delay) window.
trigger_config {
  trigger_mode: CLONE_SNAPSHOT
  trigger_timeout_ms: 86400000
  triggers { name: "snap" stop_delay_ms: 2000 }  # post-M = 2s
}
