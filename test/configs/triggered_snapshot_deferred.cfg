buffers { size_kb: 65536 fill_policy: RING_BUFFER }
data_sources { config {
  name: "linux.ftrace"
  ftrace_config {
    ftrace_events: "sched/sched_switch"
    ftrace_events: "sched/sched_waking"
    deferred_raw_capture { enabled: true per_cpu_mem_limit_kb: 256 retain_seconds: 30 }
  }
}}
trigger_config {
  trigger_mode: CLONE_SNAPSHOT
  trigger_timeout_ms: 3600000
  triggers { name: "snap" stop_delay_ms: 1000 }
}
